# The demo agent: every capability on, working in the project folder. `paf chat`
# runs it by default. Every key is documented in docs/spec-reference.md; an omitted
# block uses the default listed there (files, shell, git and the code map default
# to the repository root, the vault to data/vault/, skills to data/skills/).

name: demo_assistant
profile: demo

# Needs OPENAI_API_KEY. Any pydantic-ai model string works (openrouter:..., ollama:...).
model: openai:gpt-6-luna

instructions: |
  # Role

  You are a capable general-purpose AI assistant and technical collaborator. Your primary strength is software engineering, but your job is broader than coding — research, troubleshooting, planning, writing, analysis, decisions, projects, and everyday life. Adapt to the task instead of forcing every problem into a coding workflow.

  # Style

  Be direct: match the length of your reply to the weight of the ask — a one-line question gets a one-line answer, and finished work gets a short report of what changed, what's verified, and what's left, never a replay of the process. No filler ("Great question," "I'd be happy to"), no restating the request back, no re-summarizing what you already said, no narrating tool calls the user can see. Plain claims over adjectives; when unsure, say so plainly. Agree because it's right, not because the user said it. Depth is earned — give it when the user asks for detail, teaches, or the stakes demand it, not by default.

  # Working

  Be decisive. Act, don't narrate: don't emit process filler ('let me…', 'OK', 'I'll now…') — make the tool call or give the answer. If you catch yourself repeating the same sentence or intent, stop and act; repetition means change approach, not continue. Prefer doing the work over explaining how you could, and don't overthink or second-guess a settled call. Start from what's already in the conversation; make low-risk assumptions and continue. Ask a focused question only when you're truly unsure and the answer would change what you do — one question, not several. Never fabricate tool results, file contents, output, sources, or actions. Decide and act on the first reasonable interpretation; don't re-litigate an earlier choice.

  # Files and Search

  Search narrow, not wide. Start from the most specific thing you know — a filename, a symbol, an exact phrase, an import, an error string. A repo-wide scan is a last resort, not a first move. If a targeted search misses, refine toward a known term and search again; narrow the query, don't widen the scope. For code, search by structure — definitions, imports, class and function names, call sites — not generic keywords. Read the smallest region that answers the question before reading whole files.

  # Coding

  Work like an experienced engineer inside a real codebase. Understand the existing system before you change it, and preserve its architecture, conventions, and interfaces unless there's a clear reason not to. Prefer the smallest complete change over new abstraction or a broad rewrite. When debugging, find the underlying cause instead of patching symptoms. Don't invent APIs, library behavior, config options, or command output. Give code the user can run, not pseudocode, unless pseudocode was asked for.

  # Standard

  Leave the user with a correct answer, a working solution, a finished artifact, or a clear next action.

# usage_limits:
#   request_limit: 50      # most model requests one turn may make

# approvals:
#   timeout: 600           # seconds an approval waits for you before it is denied

model_settings:
  temperature: 0
  max_tokens: 32768
  # The `openai_` prefix is required: a bare `reasoning_effort` is silently dropped.
  openai_reasoning_effort: low

# Pages `fetch_web_page` may pull into context. Search itself is unrestricted.
web:
  # search_backend: auto   # auto (Tavily if TAVILY_API_KEY is set, else DuckDuckGo) | tavily | duckduckgo
  search_domains:
    - docs.pydantic.dev
    - ai.pydantic.dev
    - pydantic.dev
    - docs.python.org
    - github.com
    - developer.mozilla.org
    - nodejs.org
    - nextjs.org
    - react.dev
    - playwright.dev
    - pytest.org
    - docs.streamlit.io
    - docs.tavily.com

# Hosts the browser may visit, and their subdomains. Private and loopback addresses
# stay blocked; to browse a local site, name it here and set
# `block_private_addresses: false`.
browser:
  allowed_domains:
    - docs.python.org
    - developer.mozilla.org
    - github.com
    - example.com
  # block_private_addresses: false   # lets an allowlisted local site be reached

# Describes images and screenshots for the main model.
visual:
  model: openai:gpt-6-luna

# The next three default to the repository root. Uncomment to point them elsewhere.
# filesystem:
#   root_dir: .
#   deny_secret_files: true      # refuse .env*, keys, .ssh/ at any depth
#   denied_patterns: ["private/**"]
# git:
#   root: .
# codebase_map:
#   scan_root: .

# A folder of Markdown notes (an Obsidian vault, say). Defaults to data/vault/.
# vault:
#   root: /path/to/your/notes
#   allow: ["Projects/**"]
#   deny: ["Private/**"]

# Extra directories of SKILL.md files. Defaults to data/skills/.
# skills:
#   libraries: [data/skills]

# What the model is told about paths and your environment each turn.
# workspace:
#   expose_paths: false
#   notes: ["Projects live under ~/projects"]

# Commands run on the host. Anything irreversible pauses for your approval with a
# preview of what it would touch; with nobody attached it is refused. See
# docs/security/shell-command-policy.md. For a container instead, add
# `executor: {backend: docker}`.
shell:
  # cwd: .
  # executor: {backend: docker, network: none, memory: 1g}
  command_policy:
    default: allow
    unparseable: approve
    unknown_scripts: allow
    rules:
      - effects_any: [delete]
        targets_any: ["/", "/*", "~", "~/", "$HOME", "/home", "/etc", "/usr"]
        action: block
        why: deletes the root, your home, or a system directory
      - effects_any: [delete, discard, force_push, disk, overwrite, data]
        action: approve
      - commands: [chmod, chown]
        flags_any: [-R, --recursive]
        action: approve

# Two keyless example servers. Put your own in another file and point this at it.
mcp:
  config: specs/mcp/demo_servers.json

# Sized for a model with a context window of about 160k tokens or more; lower
# `turn_boundary_target` and `target_tokens` for a smaller one.
compact:
  turn_boundary: true
  turn_boundary_target: 100000
  target_tokens: 140000
  window_max_messages: 150
  window_keep_messages: 20
  clear_tool_max_tokens: 5000
  clear_tool_keep_pairs: 6
  min_clear_tokens: 10000

memory:
  consolidate_turns: 5    # complete turns between background consolidation passes
  # max_memory_size: 65536  # most characters of MEMORY.md injected per request
  # pairwise_review: true   # merge duplicates and apply updates after each pass
  render:
    global_tokens: 2000
    project_tokens: 2500
    history_tokens: 1000
    mentioned_tokens: 300
    history_days: 30
    mentioned_max: 5
    redundancy: 0.8

# The leaves this agent may delegate to (specs/sub_agents/).
subagents:
  agents: [writer_subagent, code_reviewer_subagent, coding_subagent]
  max_concurrent: 5

# Recall over past turns (search_conversation_history).
# search:
#   max_matches: 10
#   context_lines: 5
#   scope: conversation    # or `all` for every conversation

keywords:
  curate: true            # sends skill and note digests to the model provider
  # inject: true
  # top_k: 3
  # min_score: 2.5
  # query_turns: 2

# Not in the demo profile: python (Docker sandbox), gating, guardrails and secrets.
# They belong to the `secure` profile; see specs/secure_assistant.yaml.
