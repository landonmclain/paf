# Demo/live-testing agent spec (M2) — the "EVERYTHING" sandbox.
#
# The surface for building out and tuning the FULL stack in the CLI (`python
# ui/cli2.py demo_assistant`): persistence, recall, durable memory (journal),
# and context compaction, PLUS poking at native spec-declarable capabilities.
#
# The `demo` profile (src/paf/capabilities/profiles.py) allowlists the harness
# capabilities that need a Python build step — StepPersistence,
# ConversationSearch, Memory, Compaction — mirroring the production assistant.
# These resolve via `build_agent`'s `capabilities=` seam (shared store). Native
# pydantic-ai capabilities (WebSearch, WebFetch, XSearch, Thinking, MCP,
# ToolSearch, ImageGeneration) are declared below in `capabilities:` and need no
# allowlist row.
#
# Once the experiment proves out, demo's tuned values (e.g. the `compact:`
# block) are promoted to the clean production `assistant` spec.
#
# Reference: `building-pydantic-ai-agents` skill → references/ON-DEMAND-
# CAPABILITIES.md (defer_loading), NATIVE-TOOLS.md (WebSearch/WebFetch),
# CAPABILITIES-AND-HOOKS.md (Thinking/MCP/ToolSearch). Native capability
# constructors: pydantic_ai.capabilities (v2.22.0).

name: demo_assistant

# Provider-qualified model string. Same default as the assistant: DeepSeek V4
# Flash via OpenRouter. Bare slug (NO `:nitro` suffix) — `build_agent` applies
# the OpenRouter determinism pin (provider order + fp8 quantization) via
# model_settings, and `:nitro`'s throughput routing would fight that pin and
# reintroduce run-to-run provider bounce. Requires OPENROUTER_API_KEY in .env.
model: openrouter:deepseek/deepseek-v4-flash-0731

instructions: |
  You are an assistant with access to your full conversational history through a retrieval ladder. You are given only the current question; the past conversation is NOT in your context — you must retrieve it. Answer from the evidence you actually have — the durable notebook injected below and anything you retrieve.
  CONFLICT — your durable notebook is the rendered journal: the durable facts the consolidation owner extracted, grouped by type, in the order they were first recorded. It is NOT merged, deduplicated, or consolidated — the same subject can appear more than once, and an earlier entry can be superseded by a later one; both stay in the render. It is the closest thing to ground truth you carry in-context, but do not treat it as a single polished truth. When entries on the same subject conflict, the MOST RECENTLY RECORDED one is current (read-time NEWER WINS), and prefer the user's own most recent direct wording — pull it via `read_turn` on the entry's `source_ref` if needed — over your reconstruction. Never second-guess a user-stated value (a personal best, a count, an amount); when the notebook holds only a rounded version, recover the exact figure from the source turn.
  INFERENCE — when the retrieved context does not name the asked-for fact explicitly, but the history strongly and single-mindedly implies one specific answer — or the entire session establishes one unambiguous context — do not stop at "that's not on record". Give the implied answer in hedged form — "Most likely X, but you never told me the exact Y" — so the user gets the useful answer while you stay honest about the uncertainty. Reserve a flat "not in our history" refusal for when the history is genuinely ambiguous or empty. The hedged inference is preferred over a bare refusal whenever the evidence points at a single answer.
  ORDER — when asked what happened first, answer by the date the event actually occurred, and state the dates you're comparing before giving the order.
  RETRIEVAL — work cheapest-first; never tool-call for what you already have:
  1. IN CONTEXT — a durable-fact notebook (the rendered journal) is injected into every request together with the question. Answer from it if it already covers the fact; never tool-call for something already in front of you.
  2. PAST TURN — call `search_conversation_history` (a wide search over the raw transcript of past turns) when the answer is NOT already in context. Search returns a `run_id:turn_id` ref for each hit.
  3. READ FULL TURN — when a search hit gives you a ref but not the full detail, call `read_turn` on that ref to pull the turn's complete content. Skip rungs that don't apply.
  4. VERIFY SPECIFICS — when the question asks for an exact value (a date, a count, a name, an amount) or for a personal preference or opinion of your user, AND the injected journal holds only a rounded, vague, or missing version of it — or the detail is task-specific and too granular for durable facts (e.g. a table, grid, or per-item breakdown) — then run `search_conversation_history` for the user's original wording, and call `read_turn` on the hit when the search excerpt truncates the value. But when the injected journal already records the exact value with its `source_ref`, answer from it directly: the journal IS the rendered durable record (facts + dates + provenance), and a truncated search excerpt is no more authoritative than it. Never second-guess a user-stated value that appears verbatim in the journal.
  MEMORY — you carry a read-only durable notebook (the rendered journal) injected in your context. You never write to or delete from it; a separate consolidation owner appends to it. Never claim something was remembered just because you read it; only the owner persists facts.

model_settings:
  temperature: 0

  # OpenRouter prompt caching — same defaults as the assistant spec. See
  # specs/assistant.yaml for the full comments.
  openrouter_cache_instructions: true
  openrouter_cache_messages: true
  openrouter_cache_tool_definitions: true

# Native capabilities — all resolve from YAML, no Python needed. The
# `capabilities:` list is intentionally ABSENT when every entry is commented
# out (an empty list is invalid). Uncomment the `capabilities:` line AND the
# rows you want to poke at.
#
# capabilities:
#   # Web search over the open web. `defer_loading` keeps it out of the prompt
#   # until the model asks for it.
#   - WebSearch:
#       defer_loading: true
#   - WebFetch:
#       defer_loading: true
#   - XSearch:
#       defer_loading: true
#
#   # Extended reasoning. Effort: low | medium | high (or true/false).
#   - Thinking:
#       effort: high
#
#   # Connect to an MCP server (streamable HTTP). `server` is the URL; pairs
#   # with `allowed_tools` to scope which tools the model sees.
#   - MCP:
#       server: http://localhost:8000/mcp
#
#   # On-demand tool discovery over a large/flexible tool catalog via
#   # `search_tools`. `max_results` caps how many results per search.
#   - ToolSearch:
#       max_results: 10
#       defer_loading: true
#
#   # Provider-native image generation (or a local `image_model`).
#   - ImageGeneration:
#       size: 1024x1024

# ---------------------------------------------------------------------------
# Per-assistant context-compaction tuning (option B — lives in the spec, not in
# Python). Read by `build_agent` -> `CompactionConfig` -> the no-summary ladder
# in `build_compaction()`. The `demo` profile allowlists `Compaction`, so this
# block is ACTIVE here — the sandbox where we tune compaction for a 300k-context
# live agent (NOT the benchmark harness, which keeps ~5000 to force-evict
# evidence out of context for retrieval testing). Live we want the OPPOSITE:
# keep real conversation in context, compact only when near the ceiling, and
# scavenge bulk (tool dumps) when we do.
#
# All keys optional; unset -> the builder's benchmark-tuned defaults.
#
# target_tokens: live-history size (tokens) that triggers compaction to start
#   escalating. 20000 tokens (~80k chars at 4 chars/token) — normal demo turns
#   stay well under this, so eviction only fires on genuinely long conversations
#   instead of every request (the 2500 probe fired up to 3x per turn). At ~1/15
#   of the 300k context, still conservative; can push toward ~50k later.
# window_max_messages / window_keep_messages: window trigger / tail. The
#   sliding window keeps the 5 most-recent messages (+1 preserved first prompt)
#   and drops the rest, so eviction trims hard and consolidation replays the
#   about-to-evict slice into the journal each turn it fires. Again a probe, not
#   tuned.
# clear_tool_max_tokens: whole-context token trigger for ClearToolResults — when
#   the entire live context (system + turns + tool results) exceeds this, the
#   OLDEST tool results get collapsed to a placeholder. NOT per-tool-call. 5000 is
#   intentionally low-ish so it only scavenges bulky dumps after keep_pairs.
# clear_tool_keep_pairs: always keep the 20 most-recent tool-call/result pairs.
#   A normal exploration turn runs fewer than 20 tools, so none of its results
#   get cleared mid-turn — the destructive blanking only kicks in on genuinely
#   long/huge turns. (Was 4 — too aggressive, nuked read_file results the model
#   still needed, leaving it blind mid-answer.)
# consolidate: TRUE — memory is used in demo (the everything sandbox), and the
#   journal-folding consolidation is proven in benchmark tests, so wire it in.
#   When the sliding window evicts old turns, it first folds the about-to-evict
#   slice into the durable journal via the writable owner sub-agent (now via the
#   M2 JournalStore + write_render, matching the benchmark path), so durable
#   facts survive eviction instead of being lost.
compact:
  target_tokens: 20000
  window_max_messages: 150
  window_keep_messages: 5
  clear_tool_max_tokens: 5000
  clear_tool_keep_pairs: 20
  consolidate: true