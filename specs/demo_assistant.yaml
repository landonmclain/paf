# Demo/live-testing agent spec (M2) — the "EVERYTHING" sandbox.
#
# The surface for building out and tuning the FULL stack in the CLI (`python
# ui/cli2.py demo_assistant`): persistence, recall, durable memory (journal),
# and context compaction, PLUS poking at native spec-declarable capabilities.
#
# The `demo` profile (src/paf/capabilities/profiles.py) allowlists the harness
# capabilities that need a Python build step — StepPersistence,
# ConversationSearch, Memory, Compaction — mirroring the production assistant.
# These resolve via `build_agent`'s `capabilities=` seam (shared store). Native
# pydantic-ai capabilities (WebSearch, WebFetch, XSearch, Thinking, MCP,
# ToolSearch, ImageGeneration) are declared below in `capabilities:` and need no
# allowlist row.
#
# Once the experiment proves out, demo's tuned values (e.g. the `compact:`
# block) are promoted to the clean production `assistant` spec.
#
# Reference: `building-pydantic-ai-agents` skill → references/ON-DEMAND-
# CAPABILITIES.md (defer_loading), NATIVE-TOOLS.md (WebSearch/WebFetch),
# CAPABILITIES-AND-HOOKS.md (Thinking/MCP/ToolSearch). Native capability
# constructors: pydantic_ai.capabilities (v2.22.0).

name: demo_assistant

# Provider-qualified model string. Same default as the assistant: DeepSeek V4
# Flash via OpenRouter. Requires OPENROUTER_API_KEY in .env (gitignored).
model: openrouter:deepseek/deepseek-v4-flash-0731:nitro

instructions: |
  You are an assistant with certain capabilities. Answer helpfully, use
  whichever tool or capability is relevant to the user's request, and be
  concise unless asked otherwise.

model_settings:
  temperature: 0

  # OpenRouter prompt caching — same defaults as the assistant spec. See
  # specs/assistant.yaml for the full comments.
  openrouter_cache_instructions: true
  openrouter_cache_messages: true
  openrouter_cache_tool_definitions: true

# Native capabilities — all resolve from YAML, no Python needed. The
# `capabilities:` list is intentionally ABSENT when every entry is commented
# out (an empty list is invalid). Uncomment the `capabilities:` line AND the
# rows you want to poke at.
#
# capabilities:
#   # Web search over the open web. `defer_loading` keeps it out of the prompt
#   # until the model asks for it.
#   - WebSearch:
#       defer_loading: true
#   - WebFetch:
#       defer_loading: true
#   - XSearch:
#       defer_loading: true
#
#   # Extended reasoning. Effort: low | medium | high (or true/false).
#   - Thinking:
#       effort: high
#
#   # Connect to an MCP server (streamable HTTP). `server` is the URL; pairs
#   # with `allowed_tools` to scope which tools the model sees.
#   - MCP:
#       server: http://localhost:8000/mcp
#
#   # On-demand tool discovery over a large/flexible tool catalog via
#   # `search_tools`. `max_results` caps how many results per search.
#   - ToolSearch:
#       max_results: 10
#       defer_loading: true
#
#   # Provider-native image generation (or a local `image_model`).
#   - ImageGeneration:
#       size: 1024x1024

# ---------------------------------------------------------------------------
# Per-assistant context-compaction tuning (option B — lives in the spec, not in
# Python). Read by `build_agent` -> `CompactionConfig` -> the no-summary ladder
# in `build_compaction()`. The `demo` profile allowlists `Compaction`, so this
# block is ACTIVE here — the sandbox where we tune compaction for a 300k-context
# live agent (NOT the benchmark harness, which keeps ~5000 to force-evict
# evidence out of context for retrieval testing). Live we want the OPPOSITE:
# keep real conversation in context, compact only when near the ceiling, and
# scavenge bulk (tool dumps) when we do.
#
# All keys optional; unset -> the builder's benchmark-tuned defaults.
#
# target_tokens: live-history size (tokens) that triggers compaction to start
#   escalating. PROBE VALUE: 2500 tokens (~10k chars at 4 chars/token) so the
#   ladder still fires reliably on any real conversation (turn 2+), while leaving
#   a little more room than the 1000-token first probe — enough that the agent
#   keeps a few turns of context instead of evicting every single time. Still NOT
#   a production value; raise toward ~1/6 of the 300k context (≈50k) once the
#   consolidation path is confirmed working end-to-end, before promoting.
# window_max_messages / window_keep_messages: window trigger / tail. The
#   sliding window keeps the 5 most-recent messages (+1 preserved first prompt)
#   and drops the rest, so eviction trims hard and consolidation replays the
#   about-to-evict slice into the journal each turn it fires. Again a probe, not
#   tuned.
# clear_tool_max_tokens: biggest token saver — any single tool result above this
#   is collapsed to a placeholder. 5000 scavenges only genuinely bulky dumps
#   while keeping normal tool output.
# clear_tool_keep_pairs: always keep the 4 most-recent tool-call/result pairs.
# consolidate: TRUE — memory is used in demo (the everything sandbox), and the
#   journal-folding consolidation is proven in benchmark tests, so wire it in.
#   When the sliding window evicts old turns, it first folds the about-to-evict
#   slice into the durable journal via the writable owner sub-agent (now via the
#   M2 JournalStore + write_render, matching the benchmark path), so durable
#   facts survive eviction instead of being lost.
compact:
  target_tokens: 2500
  window_max_messages: 150
  window_keep_messages: 5
  clear_tool_max_tokens: 5000
  clear_tool_keep_pairs: 4
  consolidate: true