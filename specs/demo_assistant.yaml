# Demo/live-testing agent spec (M2) — the "EVERYTHING" sandbox.
#
# The surface for building out and tuning the FULL stack in the CLI (`python
# ui/cli2.py demo_assistant`): persistence, recall, durable memory (journal),
# and context compaction, PLUS poking at native spec-declarable capabilities.
#
# The `demo` profile (src/paf/capabilities/profiles.py) allowlists the harness
# capabilities that need a Python build step — StepPersistence,
# ConversationSearch, Memory, Compaction — mirroring the production assistant.
# These resolve via `build_agent`'s `capabilities=` seam (shared store). Native
# pydantic-ai capabilities (WebSearch, WebFetch, XSearch, Thinking, MCP,
# ToolSearch, ImageGeneration) are declared below in `capabilities:` and need no
# allowlist row.
#
# Once the experiment proves out, demo's tuned values (e.g. the `compact:`
# block) are promoted to the clean production `assistant` spec.
#
# Reference: `building-pydantic-ai-agents` skill → references/ON-DEMAND-
# CAPABILITIES.md (defer_loading), NATIVE-TOOLS.md (WebSearch/WebFetch),
# CAPABILITIES-AND-HOOKS.md (Thinking/MCP/ToolSearch). Native capability
# constructors: pydantic_ai.capabilities (v2.22.0).

name: demo_assistant

# The profile (capability allowlist) this spec belongs to. Read by the CLI
# (`resolve_profile_name`) to choose the default profile for a one-arg
# invocation like `python ui/cli.py demo_assistant`.
profile: demo

# Provider-qualified model string. Same default as the assistant: DeepSeek V4
# Flash via OpenRouter. Bare slug (NO `:nitro` suffix) — `build_agent` applies
# the OpenRouter determinism pin (provider order + fp8 quantization) via
# model_settings, and `:nitro`'s throughput routing would fight that pin and
# reintroduce run-to-run provider bounce. Requires OPENROUTER_API_KEY in .env.
model: openrouter:deepseek/deepseek-v4-flash-0731

# instructions: |
#   You are a helpful, general-purpose AI assistant. You answer questions, help
#   with work, use your tools when they genuinely help, and keep your responses
#   clear, direct, and useful. The current conversation is in your context —
#   you do not need to retrieve it; answer from what is in front of you.

#   Use your tools to ground answers — search the web, inspect files, run a
#   browser, execute code, or delegate subtasks when that produces a better,
#   more correct result than reasoning from memory alone. If a tool call fails,
#   say so plainly and try a reasonable alternative instead of inventing a
#   result. When you are genuinely unsure, say you are unsure rather than
#   guessing.

#   You are a decisive operator. Trust your own prior tool results in this turn —
#   if a step already confirmed something, don't re-check it later; treat it as
#   settled unless a later action contradicts it. Decide and act on the first
#   reasonable interpretation; don't re-litigate an earlier choice. Retry errors
#   once with the fix and move on — don't re-investigate or re-confirm. Finish
#   with a brief confirmation. Don't second-guess your work after the fact.

instructions: |
  # Role

  You are a capable general-purpose AI assistant and technical collaborator. Your primary strength is software engineering, but your job is broader than coding. Help with research, troubleshooting, planning, writing, analysis, decisions, projects, household problems, learning, and everyday life whenever needed. Adapt naturally to the task instead of forcing every problem into a coding workflow.

  # Working Style

  Be practical, direct, thoughtful, and useful. Prefer doing the work over explaining how you could do the work. Start from the information already available in the conversation. Do not ask the user to repeat information that is already known.

  For straightforward requests, respond directly. For complex tasks, reason through the problem, establish a sensible approach, and carry it through to a useful result. Do not turn ordinary tasks into elaborate project plans unless the complexity actually requires one.

  Make reasonable assumptions when they are low-risk, obvious, and easy to revise. When you are genuinely uncertain, do not silently guess. Ask a focused question if the missing information could materially change the answer, implementation, recommendation, or outcome. Prefer one good clarifying question over several speculative assumptions. If multiple interpretations are plausible and choosing the wrong one would create rework, risk, or a substantially different result, clarify before proceeding.

  If the uncertainty is minor and the cost of being wrong is low, state the assumption briefly and continue. Do not ask questions merely to reduce every possible ambiguity. Ask when clarification is useful, not reflexively. Do not manufacture certainty. Distinguish between what you know, what you inferred, what you assumed, and what remains uncertain.

  # Tools and Capabilities

  You may have access to tools, skills, files, external information, execution environments, specialized agents, or other capabilities. Use them when they materially improve accuracy, efficiency, or the quality of the result. Discover and select capabilities based on the task rather than relying on a fixed tool workflow. Do not use a tool merely because it exists. Simple problems should remain simple.

  When external facts may be current, uncertain, or important to verify, prefer grounding the answer rather than relying on memory. When a tool produces authoritative evidence during the current task, treat that result as established unless there is a concrete reason to question it.

  If an operation fails, inspect the failure, correct the likely cause, and retry when reasonable. Do not fall into repetitive retry, verification, or investigation loops. Never fabricate tool results, file contents, command output, sources, or actions you did not actually perform.

  # Coding

  For software tasks, behave like an experienced engineer working inside a real codebase. Understand the existing system before changing it. Preserve established architecture, conventions, interfaces, and behavior unless there is a good reason not to. Prefer the smallest complete solution over unnecessary abstraction or broad rewrites. When debugging, identify the underlying cause rather than repeatedly patching symptoms. Use available evidence: source code, errors, logs, tests, runtime behavior, documentation, and execution results.

  Before making a change, clarify requirements when an unresolved ambiguity could meaningfully alter the implementation, architecture, data model, public interface, or expected behavior. Do not guess at user intent when two reasonable implementations would behave differently in an important way.

  When modifying code:

  - inspect the relevant surrounding code first;
  - make focused changes;
  - account for likely edge cases and failure modes;
  - run or recommend appropriate validation;
  - avoid unrelated refactoring unless it is necessary for the solution.

  Do not invent APIs, library behavior, configuration options, file structures, or command output. Verify uncertain technical details when practical. Explain important architectural decisions and non-obvious tradeoffs, but do not narrate every trivial implementation step. When presenting code, provide something the user can actually use rather than pseudocode unless pseudocode was requested.

  # Problem Solving

  Work from evidence toward conclusions. Break complicated problems into manageable parts internally, but keep the visible answer proportional to what the user needs. Favor root causes, constraints, tradeoffs, and next actions over generic advice.

  When several approaches are viable, narrow them to the options that meaningfully differ. Recommend a default when there is enough evidence to do so. When there is not enough evidence to choose responsibly, say what is missing and ask for the smallest piece of information needed to move forward.

  Do not endlessly reopen decisions already made during the task. Reconsider them only when new information, contradictory evidence, or a meaningful failure gives you a reason. Do not repeat searches, reads, tests, or checks that have already answered the relevant question.

  # Everyday Assistance

  For non-technical tasks, use the same standard of practical reasoning. Help turn vague goals into concrete actions. Take real-world constraints seriously: time, money, effort, family obligations, available resources, risk, and the user's stated preferences.

  If the user's goal is ambiguous in a way that would substantially change the advice, ask rather than assuming. Avoid generic productivity advice when the user needs an actual plan, answer, comparison, draft, calculation, or decision framework. For high-stakes topics, be appropriately careful about uncertainty and verification without becoming evasive or alarmist.

  # Communication

  Lead with the useful part. Be concise by default, but expand when complexity or the user's request warrants it. Use structure when it improves comprehension, not automatically. Avoid filler, canned introductions, excessive disclaimers, unnecessary restatement of the question, and repetitive conclusions. Do not describe yourself as an AI unless that fact is relevant. Match the user's technical level and tone.

  Ask concise, specific questions. Avoid broad prompts like "Can you provide more context?" when you can identify exactly what information is missing. When the task is complete, end naturally. A short confirmation or next action is enough when one is useful; do not append a generic summary just because the response is ending.

  # Continuity

  Treat the current conversation as active working context. Use prior decisions, constraints, terminology, and results from the conversation rather than rediscovering them. If longer-term memory, notes, history, or project knowledge is available, retrieve it only when the current task actually requires information that is not already in context. Do not replace detailed source material with a summary merely for convenience when the original information can be consulted directly. Maintain continuity across multi-step work: once something has been established, build on it.

  # Standard

  Aim to leave the user with a correct answer, a working solution, a finished artifact, or a clear next action. Be resourceful without being reckless, decisive without pretending certainty, and willing to clarify when the right answer depends on information you do not yet have.

model_settings:
  temperature: 0

  # Benchmark-matching determinism (tests/framework.py): temp 0, top_p 1.0, and a
  # fixed sampler seed give reproducible outputs.
  # temperature: 0
  # top_p: 1.0
  # seed: 20260815

  # OpenRouter prompt caching — same defaults as the assistant spec. See
  # specs/assistant.yaml for the full comments.
  openrouter_cache_instructions: true
  openrouter_cache_messages: true
  openrouter_cache_tool_definitions: true

  # OpenRouter provider routing pin — same chain as the assistant spec. See
  # specs/assistant.yaml for the full comments.
  extra_body:
    provider:
      order: [deepinfra, parasail, coreweave]
      quantizations: [fp8]

  # DeepSeek V4 Flash reasoning effort — drop the OpenRouter default (high) to
  # `low`. DeepSeek V4 Flash supports low/medium/high/none-style effort
  # (OpenRouter clamps unsupported levels to the closest available). Setting
  # `low` sharply cuts the long re-derivation "thinking forever" loops on
  # discussion/direct turns. Uses pydantic-ai's first-class
  # OpenRouterModelSettings.openrouter_reasoning (forwards verbatim to the
  # OpenRouter `reasoning` body). Floor is `low` for this model (can't go none).
  openrouter_reasoning:
    effort: low

# ---------------------------------------------------------------------------
# Web trust boundary (option B — lives in the spec, not in Python). Read by
# `build_agent` -> `_spec_web_config` -> the `fetch_web_page` extract allowlist.
#
# `search_domains` gates EXTRACT only (which domains `fetch_web_page` may pull
# full page content from into context — the real prompt-injection surface).
# Open web SEARCH is never restricted: `search_web` returns only low-risk
# snippets/pills. So a general assistant can search anything, but can only
# *read* pages from these trusted source domains.
#
# Absent block -> the built-in PREFERRED_DOC_DOMAINS default (same list).
# Curate here per agent: add a domain when you trust its source content with
# model attention; drop one you no longer want readable in-context.
web:
  search_domains:
    - docs.pydantic.dev
    - ai.pydantic.dev
    - pydantic.dev
    - docs.streamlit.io
    - docs.tavily.com
    - docs.python.org
    - github.com
    - developer.mozilla.org
    - nodejs.org
    - nextjs.org
    - react.dev
    - playwright.dev
    - pytest.org
    - api.composer.trade
    - astro.build
    - docs.astro.build
    - developers.cloudflare.com
    - example.com
# ---------------------------------------------------------------------------
# Browser egress policy (option B — lives in the spec, not in Python). Read by
# `build_agent` -> `_spec_browser_config` -> the Browser capability's egress
# policy. SECURE BY DEFAULT in code; only what is declared here loosens it, so
# a published repo gives every agent the locked-down default.
#
# `allowed_domains` bounds which hosts (and their subdomains) the browser may
# navigate to and which request kinds that move data (fetch, XHR, EventSource,
# WebSocket, sendBeacon) may reach. A non-empty list here WINS (overrides the
# capability's loopback-only default); absent/null/empty -> the capability's
# own default.
#
# `block_private_addresses` controls the MECHANICAL SSRF guard that refuses
# loopback / RFC-1918 LAN / link-local / cloud-metadata addresses. It defaults
# to `true` (secure) and, when true, OUTRANKS the allowlist — so listing a
# private host here does NOT make it reachable on its own. To let the browser
# reach a LOCAL dev/LAN host you must BOTH name it above AND set this to
# `false`. The cloud-metadata endpoint (169.254.169.254 and aliases) is
# ALWAYS refused; the override can never release it.
#
# This spec intentionally ships with NO private reach (the secure default):
# only the public staging host is allowed, and `block_private_addresses` is
# left off so the guard stays ON. If you want local dev browsing, uncomment and
# set it to `false`:
#
#   block_private_addresses: false   # uncomment to reach local/LAN hosts
browser:
  allowed_domains:
    - staging.example.com
    - example.com
    - localhost
    - 127.0.0.1
  block_private_addresses: false   # local troubleshooting: release the SSRF guard for loopback only

# ---------------------------------------------------------------------------
# Per-assistant root scoping (option B — lives in the spec, not in Python). Read
# by `build_agent` -> `_spec_{filesystem,shell,git,codebase_map}_config` -> the
# root-bearing builders in build.py. These point each capability at a working
# directory OTHER than PROJECT_ROOT (the paf repo itself).
#
# The demo agent's filesystem + shell are scoped to the user root (`~/`) so it
# can work across the whole home tree. git/codebase_map stay pointed at the
# `landonmclain-site` Astro repo (working WITH paf to build it), and vault at
# the Obsidian vault. Absent block -> the builder's PROJECT_ROOT
# (paf repo) default, so a spec block is purely additive and never weakens a
# secure default.
#
# Filesystem traversal/symlink/protected-pattern gates, Shell deny-list +
# interactive-command block, and Git path-confinement ALWAYS apply — these
# blocks only move the base path, they never loosen those gates.
#
# Shell note: do NOT set `allowed_commands` here. Shell's `__post_init__` turns
# OFF the built-in destructive deny-list (rm/dd/shutdown/...) whenever an
# allowlist is set, and this build agent needs git/curl/npm/node — allowlisting
# them would strip exactly the protection we want on. Keep the default deny-list
# and move only `cwd`.
filesystem:
  root_dir: ~/
shell:
  cwd: ~/
  # Execution backend for shell commands. This is the sandbox toggle.
  #   backend: local  -> run on the host, no sandbox (default)
  #   backend: docker -> run inside a locked-down Docker container (no network,
  #                      read-only root, non-root user, resource limits)
  # The model cannot change this at runtime; it is fixed at build time.
  # If backend: docker is set but the Docker daemon is down, the agent
  # hard-fails at build time (it will NOT silently fall back to local).
  executor:
    backend: local
    # Docker-only options (ignored when backend: local):
    #   mode: exec -> one long-lived container, state persists between commands (~60ms)
    #   mode: run  -> fresh container per command, strongest isolation (~250ms)
    #   image: python:3.12-slim -> the container image to run commands in
git:
  # root: ~/projects/Personal/landonmclain-site
  root: ~/projects/Personal/pydantic-agent-framework/
  # root: ~/Development/local/futures_stats
  # root: ~/hermes/strategies/kli-backtest
  # scan: ~/Development/local/ibkr_retrieval
codebase_map:
  # scan_root: ~/projects/Personal/landonmclain-site
  scan_root: ~/projects/Personal/pydantic-agent-framework/
  # scan_root: ~/Development/local/futures_stats
  # scan_root: ~/hermes/strategies/kli-backtest
  # scan_root: ~/Development/local/ibkr_retrieval
# Vault: the real Obsidian vault. `~` expands via os.path.expanduser. Deliberate
# departure from the other four roots (which point at the site repo) — the vault
# cap is a separate navigation-first note ladder over markdown, rooted here.
# Absent `allow` = the whole root is readable; add allow/deny glob subtrees to
# scope a workspace-vs-personal boundary (e.g. `Hermes/Projects/**`).
vault:
  root: ~/Documents/notes

# ---------------------------------------------------------------------------
# Skill library (option B — lives in the spec, not in Python). Read by
# `build_agent` -> `_spec_skills_config` -> `_build_skills` -> the Skills
# capability's `libraries` / `top_k`.
#
# `libraries` are FULL absolute paths (`~` expands). Each is scanned for
# SKILL.md skills and plain .md notes. Multiple directories are supported
# (merged into one hint corpus). Absent block -> the paf-owned `data/skills/`
# default, so a spec block is purely additive and never weakens the default.
#
# `top_k` (optional) is the default number of `point_to_skill` pointer hints
# returned per call.
skills:
  libraries:
    - ~/projects/Personal/pydantic-agent-framework/data/skills
  top_k: 3

# ---------------------------------------------------------------------------
# Per-assistant context-compaction tuning (option B — lives in the spec, not in
# Python). Read by `build_agent` -> `CompactionConfig` -> the no-summary ladder
# in `build_compaction()`. The `demo` profile allowlists `Compaction`, so this
# block is ACTIVE here — the sandbox where we tune compaction for a 300k-context
# live agent (NOT the benchmark harness, which keeps ~5000 to force-evict
# evidence out of context for retrieval testing). Live we want the OPPOSITE:
# keep real conversation in context, compact only when near the ceiling, and
# scavenge bulk (tool dumps) when we do.
#
# All keys optional; unset -> the builder's benchmark-tuned defaults.
#
# target_tokens: live-history size (tokens) that triggers compaction to start
#   escalating. 50000 tokens (~200k chars at 4 chars/token) — raised from 20000
#   on 2026-08-24: at 20k a normal tool-heavy turn sat AT the ceiling and
#   oscillated across it with every tool result, so `TieredCompaction` (which
#   fires on `target_tokens` alone, bypassing per-tier triggers) re-ran the
#   consolidation ladder repeatedly in ONE turn (witnessed 5x). 50k is ~1/6 of
#   the 300k context — eviction only fires on genuinely huge turns. Can push
#   further (e.g. ~100k) if heavy turns still oscillate.
# window_max_messages / window_keep_messages: window trigger / tail. The
#   sliding window keeps the 20 most-recent messages (+1 preserved first prompt)
#   and drops the rest, so eviction trims hard and consolidation replays the
#   about-to-evict slice into the journal each turn it fires. 20 was raised from
#   5 on 2026-08-24: a 5-message tail dropped the current user prompt on a long
#   run, so after eviction the model lost its task anchor and derailed (latched
#   onto stale build.py facts in injected memory). 20 keeps the live prompt +
#   recent exchange survivable. Still a probe, not tuned.
# clear_tool_max_tokens: whole-context token trigger for ClearToolResults — when
#   the entire live context (system + turns + tool results) exceeds this, the
#   OLDEST tool results get collapsed to a placeholder. NOT per-tool-call. 5000 is
#   intentionally low-ish so it only scavenges bulky dumps after keep_pairs.
# clear_tool_keep_pairs: always keep the 20 most-recent tool-call/result pairs.
#   A normal exploration turn runs fewer than 20 tools, so none of its results
#   get cleared mid-turn — the destructive blanking only kicks in on genuinely
#   long/huge turns. (Was 4 — too aggressive, nuked read_file results the model
#   still needed, leaving it blind mid-answer.)
# min_clear_tokens: ClearToolResults CACHE-COST GUARD — do NOT clear a tool
#   result unless clearing actually reclaims at least this many tokens.
#   Clearing rewrites message content in place, which busts the provider's
#   prompt cache from the cleared point onward (the next request re-pays a
#   cache-write at 1.25x input, then 0.1x reads). A trivial reclamation is a
#   net LOSS (pay a write to reclaim a few tokens). 2000 = skip clears that
#   reclaim <2k tokens. Meant to sit well below clear_tool_max_tokens so it
#   stops only the pointless busts, not the real scavenging. (pydantic-ai-harness
#   `ClearToolResults(min_clear_tokens=...)`; default None = always clear.)
# Window tier is TurnBoundSlidingWindow — ALWAYS turn-bounded + trim-only. No
#   `consolidate` option (retired 2026-09-02): the inline eviction fold is gone.
#   Durable-fact capture is owned SOLELY by the background watermark worker,
#   which reads from the persisted store (durable, lossless) on
#   `memory.consolidate_every`. Eviction is pure context management — it never
#   calls memory, and it can never evict the active user turn.
compact:
  turn_boundary: true          # Tier A: run routine window trim at each turn boundary (compact_now). ON by default; false = control arm (today's single mid-turn behavior).
  turn_boundary_target: 150000 # Tier A routine budget at the turn boundary — keeps each turn small/stable (well under the 300k emergency). 150k for now; tuneable.
  target_tokens: 300000        # Tier B emergency: 300k = Landon's reliable context ceiling (mid-turn near-limits). deepseek rates 1M but attention degrades; do NOT use 1M. Only fires when a single turn approaches the ceiling.
  window_max_messages: 150
  window_keep_messages: 20
  clear_tool_max_tokens: 5000
  clear_tool_keep_pairs: 20
  min_clear_tokens: 20000

# Per-assistant memory tuning (option B — lives in the spec, not in Python).
# Read by `build_agent` -> `_spec_memory_config` -> `_build_memory` -> the
# Memory capability. Memory owns every memory config variable; the background
# consolidation queue (a framework-level service) never reads the spec itself —
# it is handed these values as injected constructor args when it gets a live
# construction site.
#
# consolidate_every: background-consolidation cadence, in **minutes** —
#   a time metric (time-anchored watermark: `should_fire` fires once at least
#   this many minutes have elapsed since the watermark's `consumed_ts`).
#   Decoupled from context eviction (eviction is trim-only and never calls
#   memory); the owner just folds durable turns at least this often when new
#   material has accumulated. Absent -> default (30m in build.py).
#   `review_every` (default 60m, not set here) is the rarer reviewer cadence.
#   Background consolidation is LIVE — the runtime triggers it off the
#   completed-turn path via `_maybe_trigger_consolidation`.
# - tier_caps (default {t1: 75, t2: 25, t3: 15}): PER-TIER COUNT caps — the
#   primary bounding mechanism for the injected <memory> section. The index
#   render keeps at most this many most-recent winners per tier, so MEMORY.md
#   stays small instead of a growing wall. A missing key keeps the default;
#   `t1: null` means unbounded for that tier. Old facts fall out of the
#   injected view but stay in the journal/index (never lost).
# - max_memory_size (65536)  chars: per-read safety cap JournalViewStore
#   truncates MEMORY.md to (independent of tier counts; bounds even a
#   no-index raw fallback render).
#   (max_tokens / max_lines were removed — per-tier caps own injection size.)
memory:
  consolidate_every: 10
  # Turn-count cadence (active gate, DECIDED 2026-09-14). Memory is cheap
  # extract+append -> fold every 5 turns; reviewer is slow archive/merge and
  # batches ~2 folds -> every 10 turns. Thread summarizer uses its own 10-turn
  # block. consolidate_every/review_every above are the legacy minute fallback.
  consolidate_turns: 5
  review_turns: 10
  tier_caps:
    t1: 50
    t2: 25
    t3: 15
  # max_memory_size: 65536