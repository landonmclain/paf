# runtime2_test — LEAN agent for exercising the Session2 stream/event contract.
#
# Purpose: a minimal, deterministic agent for exercising the next-gen runtime
# (src/paf/runtime2.py) — the additive Phase 2 event kinds (ToolRunning on
# tool-call start, ToolError on a failed/retried result, keyed by the same
# step_id). It is intentionally NOT a full product surface — Shell is the only
# allowlisted capability — but it should still hold a light conversation, so
# you can chat with it over the web UI and drive the tool lifecycle when a task
# actually needs a command. It exists so a smoke test can assert
# ToolRunning/ToolError pairing precisely without the model derailing into
# search/vault/compaction loops (demo_assistant did exactly that).
#
# The `runtime2_test` profile (src/paf/capabilities/profiles.py) allowlists a
# SINGLE harness capability — Shell. Shell's `run_command` is the success path
# (`run_command "echo ok"` cleanly returns -> ToolRunning, no ToolError). The
# deterministic FALLIBLE path is a DENIED command — e.g. `sudo` or another
# interactive/deny-listed command, which raises ModelRetry/PermissionError ->
# non-success ToolReturnPart -> ToolError. (Non-zero exit codes do NOT error:
# `run_command` returns them as labeled output with outcome='success', so use a
# denied command, not `exit 1`, to deterministically drive ToolError.) No
# Memory/Compaction/Vault/Search/Web/Browser/Subagents. To use with a Session2:
#
#     Session2(agent_name="runtime2_test", trace=False, resume=False)
#
#   (Session2 resolves this spec's `profile: runtime2_test` key when no profile
#   is passed directly, matching how the CLIs pick the default profile.)

name: runtime2_test

# The profile (capability allowlist) this spec belongs to. Read by
# `resolve_profile_name` -> PROFILES["runtime2_test"] -> Shell-only toolset.
profile: runtime2_test

# Provider-qualified model string. Same default as the other specs: DeepSeek V4
# Flash via OpenRouter. Bare slug (NO `:nitro` suffix) — `build_agent` applies
# the OpenRouter determinism pin via model_settings. Requires OPENROUTER_API_KEY.
model: openrouter:deepseek/deepseek-v4-flash-0731

instructions: |
  You are a lean test agent. Hold a normal conversational back-and-forth: answer
  questions directly, acknowledge the user, and only reach for the `run_command`
  tool when the task actually requires running a command or checking something on
  the system. When you do use it, run the command, report the result concisely,
  and continue the conversation naturally — no need to re-run, re-search, or pad
  with extra tool calls. If a command fails (non-zero exit or a denied command),
  say plainly that it failed and report the error. Keep replies brief and helpful.

model_settings:
  # Maximum determinism: temp 0 + fixed seed so smoke tests for the event
  # contract (ToolRunning/ToolError pairing) are reproducible.
  temperature: 0
  seed: 0

  # OpenRouter prompt caching — same defaults as the other specs.
  openrouter_cache_instructions: true
  openrouter_cache_messages: true
  openrouter_cache_tool_definitions: true

  # OpenRouter provider routing pin — same chain as the other specs.
  extra_body:
    provider:
      order: [deepinfra, parasail, coreweave]
      quantizations: [fp8]

# Root the single shell capability at a stable, harmless working directory.
# (No filesystem/git/codebase_map/vault blocks — none are allowlisted.)
shell:
  cwd: ~/projects/Personal/pydantic-agent-framework
