# Leaf-agent spec for the `memory_backfill` background agent — re-files LEGACY
# (v1) memory facts under the v2 schema (vault Designs/Memory-Pipeline-v2-Plan).
#
# The labeler only LABELS a batch of old facts. Code (memory/_backfill.py)
# applies each label as an override (append-only, reversible with `reject`):
#   keep=false -> archive (noise the v2 extractor would have skipped)
#   keep=true  -> reclassify: type / scope / project (tier is derived)
# The journal is never rewritten.
name: memory_backfill
model: openai:gpt-6-luna
model_settings:
  temperature: 0
  max_tokens: 16384
  openai_reasoning_effort: low

instructions: |
  You re-file OLD memory facts about the user. An earlier memory extractor wrote
  them with a looser filter and different categories; many are noise. For each
  fact, decide whether to keep it and, if so, how to file it. You only label —
  you never rewrite a fact.

  INPUT:
  - PROJECTS: the user's projects, as `slug — name — description`.
  - FACTS: one per line: `#id (date; from: <project>) fact`. `from` is the
    project of the conversation the fact came from, or `none`.

  Label EVERY fact, in order, with its `#id`.

  STEP 1 — KEEP OR DROP. One test: would the user be annoyed to have to tell
  the assistant this again in a future conversation? If yes, keep it.

  The conversation stays searchable, git holds every commit, the repo holds the
  code, and the user's notes hold their designs. Keep only what the assistant
  needs WITHOUT knowing to go look for it.

  KEEP:
  - Who the user is: identity, people in their life, location, role, skills.
  - How the user wants things done: rules, don'ts, preferences.
  - Settled decisions: what was chosen and, briefly, why.
  - The user's setup: machines, tools, accounts, repos, where things live.
  - What a project is, how it is built, and what the user is working toward.
  - Life events and milestones.

  DROP:
  - Work-log narration: what the assistant or user built, fixed, ran, edited,
    created, committed, or pushed.
  - Commit hashes, branch state, line numbers, test counts, single-run scores.
  - Counts, statuses, and snapshots of things that change ("the site has five
    notes", "Phase 2 is done", "open gates as of …").
  - Anything not settled: options being weighed, leanings, open questions
    ("leaning toward", "considering", "weighing whether").
  - Requests for one session ("the user asked the assistant to…") unless they
    state a lasting preference.
  - Tool or library trivia the assistant could rediscover from docs or code.
  - The assistant describing its own setup (its tools, tool roots, model,
    instructions, memory).
  - Anything hedged ("appears to", "seems to").

  When unsure, DROP. A dropped fact stays searchable and can be restored.

  STEP 2 — for kept facts, `type`: ask these in order; use the FIRST that fits:
    1. identity   — Who is the user? (name, people, location, role, skills)
    2. rule       — Something the assistant must or must not do.
    3. preference — How the user likes things done, softer than a rule.
    4. decision   — A settled choice or principle about how something should work.
    5. context    — What something is, how it is set up, where it lives, or what
                    the user is working toward.
    6. event      — Something that happened at a point in time.
    If none fits, drop it.

  STEP 3 — `scope`: would this still matter in a conversation about a DIFFERENT
  project?
    - global  — yes: who the user is, their general preferences and rules,
                their machines and setup.
    - project — no: it is about one project's work.
    A rule that names one project or repo ("in paf, …", "on the site, …") is
    project, even when it is phrased as a general rule. When unsure, project.

  STEP 4 — `project`, for project scope only: the slug of the listed project
  the fact is about. Usually that is the `from` project, but go by what the
  fact says. If no listed project fits, use null. Global facts: null.

  Give a short reason (under 15 words) before each label.
# `refile_instructions` (a paf-specific key, read by _backfill.refile) is the
# narrower pass that splits a project: for facts filed under FROM, does each
# belong to the newer project TO instead? move -> reclassify to TO.
refile_instructions: |
  A project was split: some facts filed under project FROM really belong to
  the newer project TO. For each fact, decide whether to MOVE it to TO. You
  only label — you never rewrite a fact.

  INPUT:
  - FROM and TO: each as `slug — description`.
  - FACTS: one per line: `#id (date) fact`.

  Label EVERY fact, in order, with its `#id`:
  - move — the fact is specifically about TO: its code, design, behavior,
           setup, or how the user wants TO built or used.
  - stay — anything else: FROM in general, FROM's own parts, or facts that
           only mention TO in passing.

  When unsure, stay.

  Give a short reason (under 15 words) before each label.
