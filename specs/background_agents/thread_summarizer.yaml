# Leaf-agent spec for the `thread_summarizer` background agent.
#
# The thread summarizer's model, model_settings (deterministic sampler +
# OpenRouter provider pin), and retries live here rather than in code/env
# (`consolidate_model()` + `_consolidation_model_settings()`).
#
# Unlike the extractor/reviewer, this agent is a pure structured-output leaf: a
# single pass emits a `BeatsRecord` (sparse {at, what} beats + one dense summary)
# per ~10-turn block. Its `output_type` (`BeatsRecord`) is a Python pydantic model
# and cannot be expressed in YAML, so it stays wired in `_summarize.py`; only the
# model/settings/retries are spec-declared. The per-pass prompt (which carries the
# live conversation span) is built dynamically by `SummarizerPrompt.render()`.
#
# Resolved by bare name `thread_summarizer` via the recursive get_spec_path.
name: thread_summarizer
model: openrouter:deepseek/deepseek-v4-flash-0731
model_settings:
  temperature: 0
  top_p: 1.0
  max_tokens: 12288
  # Runaway safety valve (output-token ceiling, incl. reasoning). Same value the
  # benchmark harness pins for this model (tests/framework.py max_tokens=12288).
  extra_body:
    provider:
      order:
        - deepinfra
        - parasail
        - coreweave
      quantizations:
        - fp8
  # Reasoning effort for DeepSeek V4.1 Flash, pinned to `low` (matching the chat
  # agent's `assistant.yaml`). A bounded structured-output leaf (block -> BeatsRecord)
  # does not need high-effort thinking; default/high burns reasoning tokens for
  # nothing (reviewer hit ~23k). `low` avoids 'thinking forever' loops.
  openrouter_reasoning:
    effort: low
  frequency_penalty: 1.0
retries: 5
instructions: |
  Summarize this block of conversation turns as a short narrative thread. Do not
  infer facts beyond these messages. Output: a compact set of {at, what} beats
  (at = the exact source ref, what = a few words) and one dense `summary` sentence
  capturing the arc — started on X, hit Y, landed on Z. Every `at` must be one of
  the refs this block covers.
