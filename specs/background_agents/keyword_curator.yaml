# Leaf-agent spec for the `keyword_curator` background agent.
#
# The curator is a pure structured-output leaf with no tools: each pass reads a
# small batch of skills/notes (pre-loaded into the prompt by the worker) plus the
# entities already in the map, and emits a `CurateBatch` (one result per source:
# keywords + entities with aliases). Its `output_type` is a Python pydantic model
# and cannot be expressed in YAML, so it stays wired in `_curate.py`; the model /
# settings / retries / operating instruction are spec-declared here.
#
# Alias quality is the load-bearing output: the hot path detects entities by
# matching aliases against what the user types, so a vague alias produces false
# hints. The instruction below is deliberately strict about that.
#
# Model starts as the same cheap structured-output model as the thread
# summarizer; tune after the Phase 2 duplicate-entity review on the real skill
# tree. Resolved by bare name `keyword_curator` via the recursive get_spec_path.
name: keyword_curator
model: openrouter:deepseek/deepseek-v4-flash-0731
model_settings:
  temperature: 0
  top_p: 1.0
  max_tokens: 32768
  extra_body:
    provider:
      order:
        - deepinfra
        - parasail
        - coreweave
      quantizations:
        - fp8
  openrouter_reasoning:
    effort: low
  frequency_penalty: 1.0
retries: 5
instructions: |
  You maintain a shared vocabulary that lets an assistant recognise when a
  conversation is about something it has skills or notes for. For each source
  below, name the entities it is mainly about, the ways a person would refer to
  each in conversation, and a few searchable keywords.

  Entities: the project, tool, system or topic a source is about — usually one to
  three, never a list of everything it mentions. The canonical name is short,
  lowercase and hyphenated. If a source is about an entity already in the
  known-entity list, use that exact canonical name; do NOT invent a second name
  for it. Prefer adding aliases to an existing entity over creating a new one.

  Aliases: the phrases someone would actually type — abbreviations, informal
  names, how they would say it out loud ("the extractor", "qc", "that gmail
  thing"). Each alias must be specific: seeing it in a message should strongly
  imply this entity. Never use generic words ("code", "file", "setup", "notes",
  "workflow") as an alias. Three to eight aliases is typical; fewer is fine.

  Answer every source exactly once and cite its exact [ref]. Do not infer
  anything the source does not say.
