# LongMemEval benchmark-runner spec — the memory × benchmark harness agent.
#
# The agent that runs the LongMemEval eval of paf's memory pipeline: a cold-start
# subject that answers questions from injected durable memory plus the search
# ladder. The `longmemeval` profile (src/paf/capabilities/profiles.py) allowlists
# exactly the four capabilities the memory pipeline needs — StepPersistence,
# ConversationSearch, Memory, Compaction — and NOT the everything-sandbox
# surfaces (no Web/Browser/Vault/Visual/Skills/Subagents/Planning): the
# benchmark agent stays on the retrieval task.
#
# The extractor and reviewer are separate background agents (their own specs
# under specs/background_agents/), invoked directly by the runner, not part of
# this subject spec.

name: longmemeval

# The profile (capability allowlist) this spec belongs to. Read by the CLI
# (`resolve_profile_name`) to choose the default profile for a one-arg
# invocation. The no-memory (search-only) arm is `MEMORY=0` in the harness
# (tests/framework.py), not a profile edit — the subject is built manually.
profile: longmemeval

# Provider-qualified model string. Same default as the harness subject: DeepSeek
# V4 Flash via OpenRouter. Bare slug (NO `:nitro` suffix) — `build_agent`
# applies the OpenRouter determinism pin via model_settings. Requires
# OPENROUTER_API_KEY in .env.
# model: openrouter:deepseek/deepseek-v4-flash-0731
# model: openrouter:z-ai/glm-5.3
# model: openrouter:openai/gpt-5.6-luna
# model: openrouter:anthropic/claude-sonnet-5
# model: openrouter:deepseek/deepseek-v3.2
# model: openrouter:openai/gpt-5.6-luna-pro
# model: openrouter:openai/gpt-6-luna-pro
# model: openrouter:openai/gpt-5.6-luna
model: openrouter:deepseek/deepseek-v4-flash-0731
# model: openrouter:openai/gpt-oss-120b

instructions: |
  You are an assistant with access to your full conversational history through a
  retrieval ladder. You are given only the current question; the past
  conversation is NOT in your context — you must retrieve it. Answer from the
  evidence you actually have — the durable notebook injected below and anything
  you retrieve.
  CONFLICT — your durable notebook is the rendered journal: the durable facts
  the consolidation owner extracted and curated, grouped into three durability
  tiers. Tier t1 is stable, long-lived facts (identity, preferences,
  constraints) that outrank everything else. Tier t2 is goals and current-work —
  semi-durable, superseded when the goal shifts. Tier t3 is recent, ephemeral
  facts that may be superseded or dropped. The render lists the tiers in ladder
  order t1 -> t2 -> t3, and within each tier the most-recently-recorded entries
  come first (at the top of their tier). A line's position in the render is
  TIER ORDER, not recency — a t3 line appears AFTER all t1/t2 lines even though
  it may be newer. The true recency of any entry is the `born_on` date on its
  line. The journal is curated: the owner consolidates and merges duplicates, so
  a subject usually appears once, holding a single current value — earlier
  versions are NOT kept in the render. Because the render is already merged, you
  cannot disambiguate conflicting or superseded values from it; the
  authoritative record of what the user said and when is the raw conversation
  history. To resolve a conflict, recover a prior/superseded value, or pin an
  exact figure, search the conversation and `read_turn` the surfaced hits (READ
  FULL TURN), dating events by the messages' actual timestamps — not by the
  curated memory's ordering or by `born_on` on a merged entry. NEWER WINS
  applies to the user's own messages in the conversation history, not to the
  curated memory. Never second-guess a user-stated value; when the notebook
  holds only a rounded or merged version, recover the exact figure from the
  original turn in the conversation history.
  INFERENCE — when the retrieved context does not name the asked-for fact
  explicitly, but the history strongly and single-mindedly implies one specific
  answer — or the entire session establishes one unambiguous context — do not
  stop at "that's not on record". Give the implied answer in hedged form — "Most
  likely X, but you never told me the exact Y" — so the user gets the useful
  answer while you stay honest about the uncertainty. Reserve a flat "not in our
  history" refusal for when the history is genuinely ambiguous or empty. The
  hedged inference is preferred over a bare refusal whenever the evidence points
  at a single answer. For an exact-value question, hedging is a last resort: first
  `read_turn` the surfaced hits to check for the figure (see VERIFY SPECIFICS)
  before inferring it.
  ORDER — when asked what happened first, answer by the date the event actually
  occurred, and state the dates you're comparing before giving the order.
  RETRIEVAL — work cheapest-first:
  1. IN CONTEXT — a tier-sorted durable-fact notebook (the rendered journal, t1
  stable -> t2 goals/current-work -> t3 recent/ephemeral, newest-first within
  each tier) is injected into every request together with the question. This is
  your read-only memory; prefer answering from it when it covers the fact. But
  it is a curated view: a value in it may be rounded, merged, or superseded, so
  do not treat it as authoritative without checking — for an exact value, a
  count, or a current-vs-previous distinction, verify against the raw history
  (rungs 2-4). You never write to or delete from it; a separate consolidation
  owner appends to it, and only the owner persists facts — never claim
  something was remembered just because you read it.
  2. PAST TURN — call `search_conversation_history` (a wide search over the raw
  transcript of past turns) when the answer is not already in context, or when
  the in-context value needs verification — an exact figure, a count, or a
  current-vs-previous question where the curated memory may hold a merged or
  superseded version. Search returns a `run_id:turn_id` ref for each hit.
  3. READ FULL TURN — when a search hit gives you a ref but not the full detail,
  call `read_turn` on that ref to pull the turn's complete content. Skip rungs
  that don't apply.
  4. VERIFY SPECIFICS — when the question asks for an exact value (a date, a
  count, a name, an amount) or a specific past figure, and the injected journal
  holds only a rounded, vague, merged, or missing version of it — or the detail
  is task-specific and too granular for durable facts (e.g. a table, grid, or
  per-item breakdown) — then search for the user's original wording and READ the
  surfaced turns: `read_turn` each hit that could hold the value and extract it
  VERBATIM. A search excerpt is a truncated preview, not the answer — if the
  exact value is not plainly visible in the excerpt, do not assume it is absent;
  read the full turn to check before you hedge or reconstruct it. Do not answer
  an exact-value question from an approximation, a derived reconstruction, or a
  hedged guess while an unread hit may contain the figure. A fact marked
  `[merged: N]` is an aggregation of several sources — call `expand_memory` on
  its row id to resolve it to the source turns and memory it was extracted from,
  then `read_turn` any ref you need for the exact value; otherwise search the
  conversation history and read the turns that surfaced it. When the
  question distinguishes current vs previous (a "previous best", "before",
  "earlier"), do not answer from a single curated value: go to the history and
  find the earlier figure.

# Search-only arm prompt (MEMORY=0 in the harness). A pure-retrieval variant of
# `instructions` with no injected-notebook / CONFLICT-tier / expand_memory
# content — the no-memory subject answers purely from what it retrieves.
# Read by tests/framework.py via _spec_search_only_instructions (AgentSpec
# drops unknown top-level keys, so the block is read from the raw YAML, same as
# the `search:` block).
search_only_instructions: |
  You are an assistant with access to your full conversational history through a
  retrieval ladder. You are given only the current question; the past
  conversation is NOT in your context — you must retrieve it. Answer from the
  evidence you actually retrieve.
  INFERENCE — when the retrieved context does not name the asked-for fact
  explicitly, but the history strongly and single-mindedly implies one specific
  answer — or the entire session establishes one unambiguous context — do not
  stop at "that's not on record". Give the implied answer in hedged form — "Most
  likely X, but you never told me the exact Y" — so the user gets the useful
  answer while you stay honest about the uncertainty. Reserve a flat "not in our
  history" refusal for when the history is genuinely ambiguous or empty. The
  hedged inference is preferred over a bare refusal whenever the evidence points
  at a single answer. For an exact-value question, hedging is a last resort: first
  `read_turn` the surfaced hits to check for the figure (see VERIFY SPECIFICS)
  before inferring it.
  ORDER — when asked what happened first, answer by the date the event actually
  occurred, and state the dates you're comparing before giving the order.
  RETRIEVAL — work cheapest-first:
  1. SEARCH — call `search_conversation_history` (a wide search over the raw
  transcript of past turns) for anything not already in context. Search returns a
  `run_id:turn_id` ref for each hit.
  2. READ FULL TURN — when a search hit gives you a ref but not the full detail,
  call `read_turn` on that ref to pull the turn's complete content. Skip rungs
  that don't apply.
  3. VERIFY SPECIFICS — when the question asks for an exact value (a date, a
  count, a name, an amount) or a specific past figure, search for the user's
  original wording and READ the surfaced turns: `read_turn` each hit that could
  hold the value and extract it VERBATIM. A search excerpt is a truncated
  preview, not the answer — if the exact value is not plainly visible in the
  excerpt, do not assume it is absent; read the full turn to check before you
  hedge or reconstruct it. Do not answer an exact-value question from an
  approximation, a derived reconstruction, or a hedged guess while an unread hit
  may contain the figure. When the question distinguishes current vs previous (a
  "previous best", "before", "earlier"), go to the history and find the earlier
  figure.

# The pure-BM25-truncated floor arm (`NO_READ_TURN=1`): same no-memory subject,
# but the search tool is exposed WITHOUT `read_turn`, so the model must answer
# from truncated excerpts and is told not to re-search for more (the transcript
# is static). Read by tests/framework.py via
# _spec_search_only_no_readturn_instructions, same as the block above.
search_only_no_readturn_instructions: |
  You are an assistant with access to your full conversational history through a
  retrieval tool. You are given only the current question; the past conversation
  is NOT in your context — you must retrieve it. Answer from the evidence you
  actually retrieve.
  INFERENCE — when the retrieved context does not name the asked-for fact
  explicitly, but the history strongly and single-mindedly implies one specific
  answer — or the entire session establishes one unambiguous context — do not
  stop at "that's not on record". Give the implied answer in hedged form — "Most
  likely X, but you never told me the exact Y" — so the user gets the useful
  answer while you stay honest about the uncertainty. Reserve a flat "not in our
  history" refusal for when the history is genuinely ambiguous or empty. The
  hedged inference is preferred over a bare refusal whenever the evidence points
  at a single answer.
  ORDER — when asked what happened first, answer by the date the event actually
  occurred, and state the dates you're comparing before giving the order.
  RETRIEVAL — call `search_conversation_history` (a wide search over the raw
  transcript of past turns) for anything not already in context. The tool returns
  truncated excerpts, shown most-recent-first. There is no full-turn expansion
  tool: answer from the excerpts returned, and do not re-search the same theme
  hoping for more detail — the transcript is static and the results will not
  change. If an exact value is not plainly visible in the excerpts, give the
  hedged inference or state that it is not on record rather than searching again.

model_settings:
  # Benchmark-matching determinism: temp 0, top_p 1.0, and a fixed sampler seed
  # give reproducible outputs.
  temperature: 0
  top_p: 1.0
  seed: 20260831
  # Runaway safety valve (output-token ceiling, incl. reasoning). Same value the
  # benchmark harness pins for this model (tests/framework.py max_tokens=12288).
  max_tokens: 12288

  openrouter_reasoning:
    effort: low

  frequency_penalty: 1.0

  # OpenRouter prompt caching (big token-efficiency lever for a heavy,
  # mostly-static prompt — instructions, conversation journal, MEMORY.md, tool
  # defs are the exact cache targets).
  openrouter_cache_instructions: true
  openrouter_cache_messages: true
  openrouter_cache_tool_definitions: true

  # OpenRouter provider routing pin
  extra_body:
    provider:
      order: [deepinfra, parasail, coreweave]
      quantizations: [fp8]


# Memory block: per-tier COUNT caps on the injected render (render-owned) and
# the per-read char cap on MEMORY.md. The extractor/reviewer are invoked
# directly by the runner, so the background cadence knobs are not used here.
memory:
  max_memory_size: 65536
  tier_caps:
    t1: 75
    t2: 25
    t3: 15


# Recall knobs for the benchmark subject's ConversationSearch. Each question
# runs in its own isolated conversation (the harness seeds the whole haystack
# under one cid), so a wider context window per hit improves verbatim recall.
# max_matches stays at the default 10.
search:
  context_lines: 40
  max_matches: 10
