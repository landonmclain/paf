[project]
name = "pydantic-agent-framework"
version = "0.1.0"
description = "A thin, opinionated agent framework on pydantic-ai V2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai",
    "pydantic-settings",
    "agent-foundation",
    "textual>=8.2.8",
]

# Local sibling package (not on PyPI): the framework-free storage seam.
# `agent-foundation` lives in its own repo at ~/projects/Personal/agent-foundation;
# uv resolves it from source here so both stay in one lockfile/venv. When it's
# published to PyPI, drop this block and let the version pin resolve normally.
[tool.uv.sources]
agent-foundation = { path = "/home/alice/projects/Personal/agent-foundation" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Live/integration tests are opt-in: they hit the real model + Langfuse and
# need `.env`. Excluded from the default run; invoke with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: integration test requiring .env (real model call + Langfuse tracing)",
]
# pydantic_graph emits "There is no current event loop" when run_sync executes
# outside a running loop (pytest). It's a third-party deprecation unrelated to
# our code; ignore it so the live suite is pristine.
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]

[tool.uv]
package = true

[tool.ruff]
# Reasonable defaults for a Python 3.12 framework. Line length matches the
# conventional 88 (Black-compatible) so formatting and lint agree.
line-length = 88
target-version = "py312"

# Lint rules: E (pycodestyle errors), F (pyflakes), I (isort), W (warnings),
# UP (pyupgrade modernizations), B (flake8-bugbear). E501 (line too long) is
# deliberately excluded: ruff format doesn't auto-wrap, so hand-wrapping long
# strings/URLs is fragile — keep style enforced by `ruff format` instead.
lint.select = ["E", "F", "I", "W", "UP", "B"]
lint.ignore = ["E501"]

[tool.ruff.format]
# Match Black's default quote style for consistency across the repo.
quote-style = "double"

[dependency-groups]
dev = [
    "pytest",
    "pydantic-ai-harness",
    "ruff>=0.16.1",
]
