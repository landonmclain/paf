[project]
name = "pydantic-agent-framework"
version = "0.1.0"
description = "A thin, opinionated agent framework on pydantic-ai V2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-ai", "pydantic-settings"]

[project.optional-dependencies]
dev = ["pytest", "pydantic-ai-harness"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
