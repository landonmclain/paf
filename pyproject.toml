[project]
name = "pydantic-agent-framework"
version = "0.1.0"
description = "A thin, opinionated agent framework on pydantic-ai V2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai",
    # Direct import in runtime.py (End from pydantic_graph). Declared so it
    # doesn't vanish from the venv if pydantic-ai stops pulling it transitively.
    "pydantic-graph",
    "pydantic-settings",
    "textual>=8.2.8",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.15.7",
    # The systemd-run web UI (ui/web.py → Gradio ChatInterface on :8080). Gradio
    # pulls fastapi/starlette/uvicorn/jinja2/anyio as transitive deps. Declared
    # here (not ad-hoc) so `uv sync` stops silently dropping it from the venv —
    # which broke the running paf-web.service the moment a bare sync ran. Pinned
    # to Gradio 6 (the UI's CSS targets 6.x); floor 6,<7 to avoid a surprise
    # major bump.
    "gradio>=6,<7",
    # Direct imports in repo code (specs.py → yaml, CLIs → rich, smoke script →
    # dotenv, memory toolset → typing_extensions). Declared so none vanish from
    # the venv if their transitive provider (gradio/textual/pydantic-settings)
    # changes — i.e. no package the repo's own code imports may be ad-hoc only.
    "pyyaml",
    "rich",
    # ui/chat.py's line editor + bottom toolbar (was transitive-only).
    "prompt-toolkit>=3.0",
    "python-dotenv",
    "typing-extensions",
    # The Web capability (src/paf/capabilities/web/) — search_web_docs /
    # search_official_docs / fetch_web_page — calls TavilyClient lazily at call
    # time. Declared here (not ad-hoc) so `uv sync` stops silently dropping it
    # from the venv; it was ad-hoc-only since the capability landed (2705c42),
    # so the first `uv sync` after the 22bd6f4 upgrade purged it and the tools
    # degraded to "tavily-python is not installed". Same rule as gradio below:
    # no package the repo's own code imports may be ad-hoc only.
    "tavily-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Archived reference tests (tests/retired/) import legacy modules that no longer
# exist (archived under archive/); never collected or linted. Live/integration
# tests are opt-in: they hit the real model + Langfuse and need `.env`.
norecursedirs = ["tests/retired"]
addopts = "-m 'not live'"
markers = [
    "live: integration test requiring .env (real model call + Langfuse tracing)",
]
# pydantic_graph emits "There is no current event loop" when run_sync executes
# outside a running loop (pytest). It's a third-party deprecation unrelated to
# our code; ignore it so the live suite is pristine.
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_graph",
]

[tool.uv]
package = true

[tool.ruff]
# Reasonable defaults for a Python 3.12 framework. Line length matches the
# conventional 88 (Black-compatible) so formatting and lint agree.
line-length = 88
target-version = "py312"
# Archived reference files (tests/retired/, archive/) are deliberately preserved
# as-is from their original state — not collected by pytest and not linted, so
# stale import-order/deprecation noise from historical code doesn't block CI.
exclude = ["tests/retired", "archive"]

# Lint rules: E (pycodestyle errors), F (pyflakes), I (isort), W (warnings),
# UP (pyupgrade modernizations), B (flake8-bugbear). E501 (line too long) is
# deliberately excluded: ruff format doesn't auto-wrap, so hand-wrapping long
# strings/URLs is fragile — keep style enforced by `ruff format` instead.
lint.select = ["E", "F", "I", "W", "UP", "B"]
lint.ignore = ["E501"]

[tool.ruff.format]
# Match Black's default quote style for consistency across the repo.
quote-style = "double"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",  # parallel test runs (pytest -n auto)
    # PlaywrightBrowser capability is a BUILTIN import from the harness (same
    # pattern as ToolOutputLimits / Subagents). The [playwright] extra pulls
    # `playwright>=1.61.0` + `idna`; Chromium itself needs a separate
    # `playwright install chromium` binary download for live use. Kept on the
    # harness line (dev group) because the builtin capabilities it enables are
    # only present when the dev-synced venv runs the demo/assistant CLIs.
    #
    # The [prompt-injection-defender] extra pulls `stackone-defender`, the
    # builtin PromptInjectionDefender capability (Option A of the guardrails
    # plan). The [prompt-injection-defender-ml] extra adds `onnxruntime` so
    # `semantic_detection=True` can run the local MiniLM classifier (Tier 2),
    # which catches injection under unrecognized fields that pattern detection
    # (Tier 1) misses. Declared on the harness line so it rides the harness
    # version — no separate pin — consistent with "leave builtin, don't pin".
    # Requires Python 3.11+ (paf is on 3.12).
    "pydantic-ai-harness[playwright, prompt-injection-defender, prompt-injection-defender-ml]",
    "ruff>=0.16.1",
]
