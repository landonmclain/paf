# Langfuse v4 self-hosted stack — PERSISTENT volume variant for paf's local observability.
#
# Runs Langfuse v4 (`langfuse:4` / `langfuse-worker:4`) on dedicated `langfuse4_*`
# volumes. v4 replaced the old `traces`/`observations` ClickHouse tables with a
# unified `events` data model, so a fresh install needs no migration, backfill,
# or dual-write.
#
# Usage (from paf repo root):
#   docker compose -p langfuse4 --env-file .env -f deploy/langfuse.yaml up -d
#   # wait ~60s for all services to be ready
#   docker compose -p langfuse4 -f deploy/langfuse.yaml ps
#   docker compose -p langfuse4 -f deploy/langfuse.yaml down          # stop (keeps volumes)
#   docker compose -p langfuse4 -f deploy/langfuse.yaml down -v       # stop + wipe volumes
#
# Pre-seeded API keys (via headless initialization):
#   Public key:  lf_pk_test_paf
#   Secret key:  lf_sk_test_paf
#
# OTEL endpoint:  http://localhost:3000/api/public/otel/v1/traces
# REST API:       http://localhost:3000/api/public/...
# UI:             http://localhost:3000
#
# Langfuse v4 requires a blob store for async event upload. We use the
# bundled MinIO with a one-shot init container (minio-init) that creates
# the bucket before langfuse-web starts.

services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: test-secret-for-e2e-only
      SALT: test-salt-for-e2e-only
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-test-password
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      # S3 event upload (required by Langfuse v4) — points at the bundled MinIO.
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      # Headless initialization — pre-seeds org, project, and API keys
      LANGFUSE_INIT_ORG_ID: paf-org
      LANGFUSE_INIT_ORG_NAME: paf
      LANGFUSE_INIT_PROJECT_ID: paf-project
      LANGFUSE_INIT_PROJECT_NAME: paf-framework
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q \"http://$(hostname):3000/api/public/health\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-test-password
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      SALT: test-salt-for-e2e-only
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (openssl rand -hex 32)}

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - langfuse4_postgres:/var/lib/postgresql/data

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - langfuse4_redis:/data

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-test-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - langfuse4_clickhouse:/var/lib/clickhouse
      - langfuse4_clickhouse_log:/var/log/clickhouse-server

  minio:
    image: docker.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - langfuse4_minio:/data

  # One-shot: create the Langfuse event bucket so langfuse-web/worker can
  # start cleanly. Exits successfully once the bucket exists.
  minio-init:
    image: docker.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio miniosecret &&
      (mc mb --ignore-existing local/langfuse) &&
      echo 'bucket ready'
      "
    restart: "no"

volumes:
  langfuse4_postgres:
  langfuse4_redis:
  langfuse4_clickhouse:
  langfuse4_clickhouse_log:
  langfuse4_minio:
